[package]
name = "sugarscape"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Growing Artificial Societies — an interactive Sugarscape laboratory"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"

[profile.web]
inherits = "release"
opt-level = "z"
strip = true
